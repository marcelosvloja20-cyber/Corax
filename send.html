<!-- =========================================
     CORΛX SEND.HTML
     Send Crypto Interface
========================================= -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Send | CORΛX</title>

    <!-- FONT -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <link rel="stylesheet" href="pwa.css" />

</head>

<body>

    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="grid-overlay"></div>

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>

    <div id="particles"></div>

    <!-- =====================================
         APP
    ====================================== -->

    <main class="app">

        <!-- =================================
             HERO
        ================================== -->

        <section class="hero">

            <div class="logo-wrapper">

                <div class="crow-container">

                    <div class="crow-wing left"></div>

                    <div class="crow-body"></div>

                    <div class="crow-wing right"></div>

                </div>

                <h1 class="logo-text">

                    SEND

                </h1>

            </div>

            <p class="tagline">

                Borderless Transfers

            </p>

        </section>

        <!-- =================================
             SEND CARD
        ================================== -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <h2 class="title">

                Send Crypto

            </h2>

            <p class="subtitle">

                Fast decentralized transactions

            </p>

            <!-- ADDRESS -->
            <div
                style="
                    margin-top:24px;
                "
            >

                <label
                    style="
                        color:rgba(255,255,255,.6);
                        font-size:13px;
                    "
                >

                    Recipient Address

                </label>

                <input
                    id="walletAddress"
                    type="text"
                    placeholder="0x..."
                    style="
                        margin-top:10px;
                        width:100%;
                        padding:18px;
                        border-radius:20px;
                        border:1px solid rgba(255,255,255,.08);
                        background:rgba(255,255,255,.04);
                        color:#fff;
                        outline:none;
                        font-size:15px;
                    "
                />

            </div>

            <!-- AMOUNT -->
            <div
                style="
                    margin-top:22px;
                "
            >

                <label
                    style="
                        color:rgba(255,255,255,.6);
                        font-size:13px;
                    "
                >

                    Amount

                </label>

                <div
                    style="
                        margin-top:10px;
                        background:rgba(255,255,255,.04);
                        border:1px solid rgba(255,255,255,.08);
                        border-radius:22px;
                        padding:18px;
                    "
                >

                    <div
                        style="
                            display:flex;
                            justify-content:space-between;
                            align-items:center;
                        "
                    >

                        <input
                            id="sendAmount"
                            type="number"
                            placeholder="0.00"
                            style="
                                background:none;
                                border:none;
                                color:#fff;
                                font-size:26px;
                                width:100%;
                                outline:none;
                            "
                        />

                        <select
                            id="sendToken"
                            style="
                                background:#111;
                                border:none;
                                color:#fff;
                                padding:12px;
                                border-radius:14px;
                                outline:none;
                            "
                        >

                            <option>CRX</option>

                            <option>ETH</option>

                            <option>BTC</option>

                            <option>USDT</option>

                        </select>

                    </div>

                </div>

            </div>

            <!-- NETWORK -->
            <div
                style="
                    margin-top:22px;
                "
            >

                <label
                    style="
                        color:rgba(255,255,255,.6);
                        font-size:13px;
                    "
                >

                    Network

                </label>

                <select
                    id="network"
                    style="
                        margin-top:10px;
                        width:100%;
                        padding:18px;
                        border-radius:20px;
                        border:1px solid rgba(255,255,255,.08);
                        background:rgba(255,255,255,.04);
                        color:#fff;
                        outline:none;
                    "
                >

                    <option>Ethereum</option>

                    <option>Solana</option>

                    <option>BNB Chain</option>

                    <option>Polygon</option>

                    <option>Base</option>

                </select>

            </div>

            <!-- FEE -->
            <div
                style="
                    margin-top:24px;
                    display:flex;
                    justify-content:space-between;
                    color:rgba(255,255,255,.5);
                    font-size:14px;
                "
            >

                <span>

                    Estimated Fee

                </span>

                <span>

                    $0.42

                </span>

            </div>

            <!-- BUTTON -->
            <button
                class="primary-btn"
                style="
                    margin-top:26px;
                "
                onclick="
                    executeTransfer()
                "
            >

                Send Now

            </button>

        </section>

        <!-- =================================
             RECENT
        ================================== -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <h2 class="title">

                Recent Transfers

            </h2>

            <p class="subtitle">

                Latest outgoing activity

            </p>

            <!-- ITEM -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Sent CRX

                    </div>

                    <div class="tx-date">

                        2 minutes ago

                    </div>

                </div>

                <div class="negative">

                    -240 CRX

                </div>

            </div>

            <!-- ITEM -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Sent ETH

                    </div>

                    <div class="tx-date">

                        Yesterday

                    </div>

                </div>

                <div class="negative">

                    -0.84 ETH

                </div>

            </div>

        </section>

        <!-- =================================
             ACTIONS
        ================================== -->

        <section
            style="
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:14px;
                margin-top:18px;
            "
        >

            <button
                class="secondary-btn"
                onclick="
                    window.location.href='receive.html'
                "
            >

                Receive

            </button>

            <button
                class="secondary-btn"
                onclick="
                    window.location.href='dashboard.html'
                "
            >

                Dashboard

            </button>

        </section>

        <!-- SPACER -->
        <div style="height:120px;"></div>

    </main>

    <!-- =====================================
         SCRIPT
    ====================================== -->

    <script>

        function executeTransfer(){

            const address =
                document.getElementById(
                    "walletAddress"
                ).value;

            const amount =
                document.getElementById(
                    "sendAmount"
                ).value;

            if(!address || !amount){

                createToast(
                    "Fill all fields"
                );

                return;

            }

            createToast(
                "Transaction sent 🚀"
            );

        }

        function createToast(message){

            const toast =
                document.createElement("div");

            toast.className =
                "corax-toast show";

            toast.innerText =
                message;

            document.body.appendChild(
                toast
            );

            setTimeout(() => {

                toast.remove();

            },3000);

        }

    </script>

    <!-- JS -->
    <script src="wallet.js"></script>

    <script src="fx.js"></script>

    <script src="register-sw.js"></script>

</body>
</html>
