     CORΛX LOGIN.HTML
     Premium Authentication
========================================= -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Login | CORΛX</title>

    <!-- FONT -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <link rel="stylesheet" href="pwa.css" />

</head>

<body>

    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="grid-overlay"></div>

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>

    <div id="particles"></div>

    <!-- =====================================
         APP
    ====================================== -->

    <main class="app auth-page">

        <!-- =================================
             HERO
        ================================== -->

        <section class="hero">

            <div class="logo-wrapper">

                <div class="crow-container">

                    <div class="crow-wing left"></div>

                    <div class="crow-body"></div>

                    <div class="crow-wing right"></div>

                </div>

                <h1 class="logo-text">

                    COR<span>Λ</span>X

                </h1>

            </div>

            <p class="tagline">

                Money Without Borders

            </p>

        </section>

        <!-- =================================
             LOGIN CARD
        ================================== -->

        <section class="glass-card auth-card">

            <div class="card-glow"></div>

            <h2 class="title">

                Welcome Back

            </h2>

            <p class="subtitle">

                Access your decentralized wallet.

            </p>

            <!-- EMAIL -->
            <div
                style="
                    margin-top:26px;
                "
            >

                <label
                    style="
                        color:rgba(255,255,255,.6);
                        font-size:13px;
                    "
                >

                    Email

                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    style="
                        margin-top:10px;
                        width:100%;
                        padding:18px;
                        border-radius:20px;
                        border:1px solid rgba(255,255,255,.08);
                        background:rgba(255,255,255,.04);
                        color:#fff;
                        outline:none;
                        font-size:15px;
                    "
                />

            </div>

            <!-- PASSWORD -->
            <div
                style="
                    margin-top:20px;
                "
            >

                <label
                    style="
                        color:rgba(255,255,255,.6);
                        font-size:13px;
                    "
                >

                    Password

                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    style="
                        margin-top:10px;
                        width:100%;
                        padding:18px;
                        border-radius:20px;
                        border:1px solid rgba(255,255,255,.08);
                        background:rgba(255,255,255,.04);
                        color:#fff;
                        outline:none;
                        font-size:15px;
                    "
                />

            </div>

            <!-- REMEMBER -->
            <div
                style="
                    margin-top:18px;
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    font-size:14px;
                    color:rgba(255,255,255,.55);
                "
            >

                <label
                    style="
                        display:flex;
                        align-items:center;
                        gap:8px;
                    "
                >

                    <input type="checkbox" />

                    Remember me

                </label>

                <span
                    style="
                        cursor:pointer;
                    "
                >

                    Forgot Password?

                </span>

            </div>

            <!-- LOGIN -->
            <button
                class="primary-btn"
                style="
                    margin-top:26px;
                "
                onclick="
                    login()
                "
            >

                Login

            </button>

            <!-- REGISTER -->
            <button
                class="secondary-btn"
                style="
                    margin-top:14px;
                "
                onclick="
                    window.location.href='register.html'
                "
            >

                Create Account

            </button>

        </section>

        <!-- =================================
             SECURITY
        ================================== -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                "
            >

                <div>

                    <h2 class="title">

                        Secure Access

                    </h2>

                    <p class="subtitle">

                        Enterprise-grade protection

                    </p>

                </div>

                <div class="live-badge">

                    <div class="live-dot"></div>

                    SECURE

                </div>

            </div>

            <!-- FEATURES -->
            <div
                style="
                    margin-top:24px;
                    display:grid;
                    gap:14px;
                "
            >

                <div class="history-item">

                    <div>

                        <div class="tx-type">

                            End-to-End Encryption

                        </div>

                    </div>

                    <div class="positive">

                        ACTIVE

                    </div>

                </div>

                <div class="history-item">

                    <div>

                        <div class="tx-type">

                            Multi-Chain Security

                        </div>

                    </div>

                    <div class="positive">

                        ENABLED

                    </div>

                </div>

                <div class="history-item">

                    <div>

                        <div class="tx-type">

                            Self-Custody Protection

                        </div>

                    </div>

                    <div class="positive">

                        VERIFIED

                    </div>

                </div>

            </div>

        </section>

        <!-- SPACER -->
        <div style="height:120px;"></div>

    </main>

    <!-- =====================================
         SCRIPT
    ====================================== -->

    <script>

        async function login(){

            const email =
                document.getElementById(
                    "email"
                ).value;

            const password =
                document.getElementById(
                    "password"
                ).value;

            if(!email || !password){

                createToast(
                    "Fill all fields"
                );

                return;

            }

            localStorage.setItem(
                "corax_user",
                email
            );

            createToast(
                "Login successful 🚀"
            );

            setTimeout(() => {

                window.location.href =
                    "dashboard.html";

            },1200);

        }

        function createToast(message){

            const toast =
                document.createElement("div");

            toast.className =
                "corax-toast show";

            toast.innerText =
                message;

            document.body.appendChild(
                toast
            );

            setTimeout(() => {

                toast.remove();

            },3000);

        }

    </script>

    <!-- JS -->
    <script src="wallet.js"></script>

    <script src="fx.js"></script>

    <script src="register-sw.js"></script>

</body>
</html>
