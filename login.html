<!-- =========================================
     CORΛX LOGIN.HTML
     Authentication Portal
========================================= -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Login | CORΛX</title>

    <!-- FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    />

    <!-- CSS -->

    <link rel="stylesheet" href="style.css" />

    <link rel="stylesheet" href="pwa.css" />

</head>

<body>

    <!-- BACKGROUND -->

    <div class="grid-overlay"></div>

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>

    <div id="particles"></div>

    <!-- AUTH -->

    <main class="auth-container">

        <!-- LOGO -->

        <div class="hero">

            <div class="logo-wrapper">

                <div class="crow-container">

                    <div class="crow-wing left"></div>

                    <div class="crow-body"></div>

                    <div class="crow-wing right"></div>

                </div>

                <h1 class="logo-text">

                    CORΛX

                </h1>

            </div>

            <p class="tagline">

                Money Without Borders

            </p>

        </div>

        <!-- LOGIN CARD -->

        <section class="glass-card auth-card">

            <div class="card-glow"></div>

            <h2 class="title">

                Welcome Back

            </h2>

            <p class="subtitle">

                Access your multi-chain ecosystem

            </p>

            <!-- EMAIL -->

            <div
                style="
                    margin-top:26px;
                "
            >

                <label class="input-label">

                    Email Address

                </label>

                <input
                    type="email"
                    placeholder="you@example.com"
                    class="corax-input"
                />

            </div>

            <!-- PASSWORD -->

            <div
                style="
                    margin-top:22px;
                "
            >

                <label class="input-label">

                    Password

                </label>

                <input
                    type="password"
                    placeholder="••••••••••"
                    class="corax-input"
                />

            </div>

            <!-- OPTIONS -->

            <div
                style="
                    margin-top:18px;
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                "
            >

                <label
                    style="
                        display:flex;
                        align-items:center;
                        gap:8px;
                        color:rgba(255,255,255,.65);
                        font-size:14px;
                    "
                >

                    <input type="checkbox" />

                    Remember me

                </label>

                <a
                    href="#"
                    style="
                        color:#A855F7;
                        text-decoration:none;
                        font-size:14px;
                        font-weight:600;
                    "
                >

                    Forgot Password?

                </a>

            </div>

            <!-- BUTTON -->

            <button
                class="primary-btn"
                style="
                    margin-top:26px;
                "
                onclick="
                    loginUser()
                "
            >

                Login

            </button>

            <!-- DIVIDER -->

            <div
                style="
                    margin:28px 0;
                    display:flex;
                    align-items:center;
                    gap:14px;
                    color:rgba(255,255,255,.35);
                    font-size:13px;
                "
            >

                <div
                    style="
                        flex:1;
                        height:1px;
                        background:
                        rgba(255,255,255,.08);
                    "
                ></div>

                OR CONTINUE WITH

                <div
                    style="
                        flex:1;
                        height:1px;
                        background:
                        rgba(255,255,255,.08);
                    "
                ></div>

            </div>

            <!-- SOCIAL -->

            <div
                style="
                    display:grid;
                    grid-template-columns:1fr 1fr;
                    gap:14px;
                "
            >

                <button class="secondary-btn">

                    Google

                </button>

                <button class="secondary-btn">

                    Wallet

                </button>

            </div>

            <!-- REGISTER -->

            <div
                style="
                    margin-top:28px;
                    text-align:center;
                    color:rgba(255,255,255,.65);
                    font-size:14px;
                "
            >

                Don’t have an account?

                <a
                    href="register.html"
                    style="
                        color:#A855F7;
                        text-decoration:none;
                        font-weight:700;
                    "
                >

                    Create Account

                </a>

            </div>

        </section>

    </main>

    <!-- STYLE -->

    <style>

        .auth-container{

            min-height:100vh;

            display:flex;

            flex-direction:column;

            justify-content:center;

            padding:24px;

        }

        .auth-card{

            max-width:520px;

            margin:0 auto;

            width:100%;

        }

        .input-label{

            display:block;

            margin-bottom:10px;

            color:rgba(255,255,255,.65);

            font-size:13px;

        }

        .corax-input{

            width:100%;

            padding:20px;

            border-radius:22px;

            border:
            1px solid rgba(255,255,255,.08);

            background:
            rgba(255,255,255,.04);

            color:#fff;

            outline:none;

            font-size:16px;

        }

        .corax-input::placeholder{

            color:
            rgba(255,255,255,.35);

        }

    </style>

    <!-- SCRIPT -->

    <script>

        function loginUser(){

            createToast(
                "Authentication successful 🔐"
            );

            setTimeout(() => {

                window.location.href =
                "dashboard.html";

            },1500);

        }

        function createToast(message){

            const toast =
                document.createElement(
                    "div"
                );

            toast.className =
                "corax-toast show";

            toast.innerText =
                message;

            document.body.appendChild(
                toast
            );

            setTimeout(() => {

                toast.remove();

            },3000);

        }

    </script>

    <!-- JS -->

    <script src="fx.js"></script>

    <script src="register-sw.js"></script>

</body>
</html>
