<!-- =========================================
     CORΛX PAYMENTS.HTML
     Merchant & QR Payments
========================================= -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Payments | CORΛX</title>

    <!-- FONT -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <link rel="stylesheet" href="pwa.css" />

</head>

<body>

    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="grid-overlay"></div>

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>

    <div id="particles"></div>

    <!-- =====================================
         APP
    ====================================== -->

    <main class="app">

        <!-- =================================
             HERO
        ================================== -->

        <section class="hero">

            <div class="logo-wrapper">

                <div class="crow-container">

                    <div class="crow-wing left"></div>

                    <div class="crow-body"></div>

                    <div class="crow-wing right"></div>

                </div>

                <h1 class="logo-text">

                    P<span>Λ</span>YMENTS

                </h1>

            </div>

            <p class="tagline">

                Real-World Crypto Payments

            </p>

        </section>

        <!-- =================================
             QR PAYMENT
        ================================== -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                "
            >

                <div>

                    <h2 class="title">

                        QR Payment

                    </h2>

                    <p class="subtitle">

                        Instant merchant checkout

                    </p>

                </div>

                <div class="live-badge">

                    <div class="live-dot"></div>

                    LIVE

                </div>

            </div>

            <!-- QR -->
            <div
                style="
                    margin-top:28px;
                    display:flex;
                    justify-content:center;
                "
            >

                <div
                    style="
                        width:220px;
                        height:220px;
                        border-radius:28px;
                        background:
                        linear-gradient(
                            135deg,
                            rgba(168,85,247,.25),
                            rgba(124,58,237,.12)
                        );
                        border:
                        1px solid rgba(255,255,255,.08);
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        overflow:hidden;
                    "
                >

                    <div
                        style="
                            width:150px;
                            height:150px;
                            display:grid;
                            grid-template-columns:
                            repeat(8,1fr);
                            gap:4px;
                        "
                    >

                        <script>

                            for(let i=0;i<64;i++){

                                document.write(`

                                    <div
                                        style="
                                            background:
                                            ${
                                                Math.random() > .42
                                                ?
                                                '#A855F7'
                                                :
                                                'rgba(255,255,255,.08)'
                                            };
                                            border-radius:3px;
                                        "
                                    ></div>

                                `);

                            }

                        </script>

                    </div>

                </div>

            </div>

            <!-- BUTTON -->
            <button
                class="primary-btn"
                style="
                    margin-top:24px;
                "
                onclick="
                    scanPayment()
                "
            >

                Scan Merchant QR

            </button>

        </section>

        <!-- =================================
             PAYMENT METHODS
        ================================== -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <h2 class="title">

                Supported Methods

            </h2>

            <p class="subtitle">

                Multi-chain payment support

            </p>

            <!-- ITEM -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Crypto Wallet

                    </div>

                    <div class="tx-date">

                        Direct blockchain payments

                    </div>

                </div>
