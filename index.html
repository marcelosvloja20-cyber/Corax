<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORΛX</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="bg"></canvas>
<div class="vignette"></div>

<!-- SPLASH -->
<div id="splash">
  <div class="logo-corax">
    <h1>CORΛX</h1>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<header class="hero">
  <h1>CORΛX</h1>
  <p class="tagline">Money Without Borders</p>
</header>

<!-- AUTH -->
<div id="auth" class="card glass">

<h2>Welcome</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button class="btn primary" onclick="login()">Login</button>
<button class="btn ghost" onclick="register()">Create Account</button>

<p id="errorMsg" class="error hidden"></p>

</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<div class="card glass">
<h3>User</h3>
<p id="userId"></p>
</div>

<div class="card glass balance">
<h3>Balance</h3>
<p id="balance">$100.00</p>
</div>

<div class="card glass">
<h3>Send Payment</h3>

<input type="text" id="to" placeholder="Recipient">
<input type="number" id="amount" placeholder="Amount">

<button class="btn primary" onclick="sendPayment()">Send</button>
</div>

<!-- HISTORY -->
<div class="card glass">
<h3>Transaction History</h3>
<div id="historyList"></div>
</div>

<button class="btn danger" onclick="logout()">Logout</button>

</div>

</div>

<script src="fx.js"></script>
<script src="app.js"></script>

<script>
/* SPLASH */
window.onload = () => {
setTimeout(() => {
document.getElementById("splash").style.display = "none";
document.getElementById("app").classList.remove("hidden");

if(window.CORAX_FX){
CORAX_FX.start();
}
}, 1200);
};
</script>

</body>
</html>
