<!-- =========================================
     CORΛX PREMIUM CHART SECTION
     PLACE INSIDE DASHBOARD
========================================= -->

<section class="chart-section">

    <!-- GRID -->
    <div class="chart-grid"></div>

    <!-- GLOW ORBS -->
    <div class="chart-orb one"></div>
    <div class="chart-orb two"></div>

    <!-- HEADER -->
    <div class="chart-top">

        <div>

            <div class="chart-title">
                CRX Market Performance
            </div>

        </div>

        <div class="chart-price">

            <div class="chart-value">
                $2,847.22
            </div>

            <div class="chart-growth">
                +12.8% Today
            </div>

        </div>

    </div>

    <!-- LIVE STATUS -->
    <div style="
        display:flex;
        align-items:center;
        gap:10px;
        margin-bottom:18px;
        color:#cfcfcf;
        font-size:13px;
        font-weight:600;
    ">

        <div class="live-dot"></div>

        Live Market Simulation

    </div>

    <!-- CANVAS -->
    <canvas id="coraxChart"></canvas>

    <!-- FILTERS -->
    <div class="chart-filters">

        <button class="chart-filter active">
            1H
        </button>

        <button class="chart-filter">
            24H
        </button>

        <button class="chart-filter">
            7D
        </button>

        <button class="chart-filter">
            1M
        </button>

        <button class="chart-filter">
            1Y
        </button>

        <button class="chart-filter">
            ALL
        </button>

    </div>

</section>

     IMPORTS
