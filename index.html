<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CORΛX</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#A855F7">

<link rel="stylesheet" href="style.css" />
</head>

<body>

<!-- PARTICLES -->
<canvas id="bg"></canvas>
<div class="vignette"></div>

<!-- SPLASH -->
<div id="splash">

<div class="logo-corax">

<svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">

<defs>
<linearGradient id="grad" x1="0%" y1="0%" x2="100%">
<stop offset="0%" stop-color="#A855F7"/>
<stop offset="100%" stop-color="#7C3AED"/>
</linearGradient>
</defs>

<!-- CORVO -->
<g class="crow" id="crow">

<path d="M180 60 Q220 10 300 60 Q250 50 220 80 Z"
fill="url(#grad)" class="wing"/>

<path d="M200 90 Q230 70 260 90 Q230 110 200 90 Z"
fill="url(#grad)" class="body"/>

</g>

<!-- TEXTO -->
<text x="50%" y="160"
text-anchor="middle"
font-size="70"
font-family="Arial, sans-serif"
fill="url(#grad)"
letter-spacing="6">

CORΛX

</text>

</svg>

</div>

</div>

<!-- APP -->
<div id="app" class="app hidden">

<header class="hero">

<div class="logo-corax">

<svg viewBox="0 0 600 220">

<text x="50%" y="160"
text-anchor="middle"
font-size="70"
font-family="Arial, sans-serif"
fill="url(#grad)"
letter-spacing="6">

CORΛX

</text>

</svg>

</div>

<p class="tagline">Money Without Borders</p>

</header>

<div class="card glass">
<h2>Welcome</h2>

<input type="email" placeholder="Email" />
<input type="password" placeholder="Password" />

<button class="btn primary">Login</button>
<button class="btn ghost">Create Account</button>

</div>

</div>

<!-- SCRIPTS -->
<script src="fx.js"></script>

<script>

/* SPLASH */
window.addEventListener("load", () => {

setTimeout(() => {

document.getElementById("splash").style.opacity = "0";

setTimeout(() => {
document.getElementById("splash").style.display = "none";
document.getElementById("app").classList.remove("hidden");

if(window.CORAX_FX){
window.CORAX_FX.start();
}

}, 600);

}, 1500);

});

/* INTERAÇÃO CORVO + MOUSE */
document.addEventListener("mousemove", (e) => {

const crow = document.getElementById("crow");

if(!crow) return;

const x = (e.clientX / window.innerWidth - 0.5) * 20;
const y = (e.clientY / window.innerHeight - 0.5) * 20;

crow.setAttribute("transform", `translate(${x}, ${y})`);

});

</script>

</body>
</html>
