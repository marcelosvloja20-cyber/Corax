<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CORΛX</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#A855F7">

<link rel="stylesheet" href="style.css" />
</head>

<body>

<canvas id="bg"></canvas>
<div class="vignette"></div>

<!-- SPLASH -->
<div id="splash">
  <img src="/logo.png" class="splash-logo"/>
</div>

<!-- APP -->
<div id="app" class="app hidden">

  <header class="hero">
    <div class="logo-wrap">
      <img src="/logo.png" class="logo" id="logo"/>
      <div class="logo-glow"></div>
    </div>
    <p class="tagline">Money Without Borders</p>
  </header>

  <!-- AUTH -->
  <div id="auth" class="card glass">

    <h2>Welcome</h2>

    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />

    <button class="btn primary" onclick="login()" id="loginBtn">
      Login
    </button>

    <button class="btn ghost" onclick="register()">
      Create Account
    </button>

    <p id="errorMsg" class="error hidden"></p>

  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="card glass">
      <h2>Dashboard</h2>
      <p id="userId"></p>
    </div>

    <div class="card glass balance">
      <h3>Balance</h3>
      <p id="balance">$0.00</p>
    </div>

    <div class="card glass">
      <h3>Send Payment</h3>

      <input type="text" id="to" placeholder="Recipient ID" />
      <input type="number" id="amount" placeholder="Amount" />

      <button class="btn primary" onclick="sendPayment()">Send</button>
    </div>

    <button class="btn danger" onclick="logout()">Logout</button>

  </div>

</div>

<script src="app.js"></script>
<script src="fx.js"></script>

<script>
/* SPLASH */
window.addEventListener("load", () => {
  setTimeout(() => {
    document.getElementById("splash").classList.add("fade-out");

    setTimeout(() => {
      document.getElementById("splash").style.display = "none";
      document.getElementById("app").classList.remove("hidden");

      if(window.CORAX_FX){
        window.CORAX_FX.start();
      }

    }, 600);

  }, 1600);
});

/* SERVICE WORKER */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
