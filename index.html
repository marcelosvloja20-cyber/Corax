<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>CORΛX</title>

    <!-- =====================================
         META
    ====================================== -->

    <meta
        name="theme-color"
        content="#A855F7"
    />

    <meta
        name="description"
        content="Money Without Borders"
    />

    <!-- =====================================
         PWA
    ====================================== -->

    <link
        rel="manifest"
        href="manifest.json"
    />

    <!-- =====================================
         FONTS
    ====================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    />

    <!-- =====================================
         CSS
    ====================================== -->

    <link rel="stylesheet" href="style.css" />

    <link rel="stylesheet" href="pwa.css" />

</head>

<body>

    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="grid-overlay"></div>

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>

    <div id="particles"></div>

    <!-- =====================================
         APP
    ====================================== -->

    <main class="app">

        <!-- =================================
             HERO
        ================================== -->

        <section class="hero">

            <div class="logo-wrapper">

                <!-- CROW -->
                <div class="crow-container">

                    <div class="crow-wing left"></div>

                    <div class="crow-body"></div>

                    <div class="crow-wing right"></div>

                </div>

                <!-- LOGO -->
                <h1 class="logo-text">

                    COR<span>Λ</span>X

                </h1>

            </div>

            <!-- TAG -->
            <p class="tagline">

                Money Without Borders

            </p>

        </section>

        <!-- =================================
             AUTH CARD
        ================================== -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <h2 class="title">

                Welcome Back

            </h2>

            <p class="subtitle">

                Access your decentralized financial ecosystem.

            </p>

            <!-- =============================
                 FORM
            ============================== -->

            <form
                id="authForm"
                style="
                    margin-top:28px;
                    display:grid;
                    gap:16px;
                "
            >

                <!-- EMAIL -->
                <input
                    id="email"
                    type="email"
                    placeholder="Email Address"
                    required
                    style="
                        width:100%;
                        padding:18px;
                        border-radius:20px;
                        border:1px solid rgba(255,255,255,.08);
                        background:rgba(255,255,255,.04);
                        color:#fff;
                        font-size:15px;
                        outline:none;
                    "
                />

                <!-- PASSWORD -->
                <input
                    id="password"
                    type="password"
                    placeholder="Password"
                    required
                    style="
                        width:100%;
                        padding:18px;
                        border-radius:20px;
                        border:1px solid rgba(255,255,255,.08);
                        background:rgba(255,255,255,.04);
                        color:#fff;
                        font-size:15px;
                        outline:none;
                    "
                />

                <!-- LOGIN -->
                <button
                    type="submit"
                    class="primary-btn"
                >

                    Login

                </button>

                <!-- CREATE -->
                <button
                    type="button"
                    id="createBtn"
                    class="secondary-btn"
                >

                    Create Account

                </button>

            </form>

        </section>

        <!-- =================================
             FEATURES
        ================================== -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <h2 class="title">

                Why CORΛX?

            </h2>

            <p class="subtitle">

                Built for the future of global payments.

            </p>

            <!-- FEATURE -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Instant Transfers

                    </div>

                    <div class="tx-date">

                        Lightning-fast settlements

                    </div>

                </div>

                <div class="positive">

                    LIVE

                </div>

            </div>

            <!-- FEATURE -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Multi-Chain

                    </div>

                    <div class="tx-date">

                        Cross-network compatibility

                    </div>

                </div>

                <div class="positive">

                    ACTIVE

                </div>

            </div>

            <!-- FEATURE -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Self Custody

                    </div>

                    <div class="tx-date">

                        Full ownership of assets

                    </div>

                </div>

                <div class="positive">

                    SECURE

                </div>

            </div>

        </section>

        <!-- =================================
             CTA
        ================================== -->

        <section
            style="
                margin-top:20px;
            "
        >

            <button
                class="primary-btn"
                style="
                    width:100%;
                "
                onclick="window.location.href='dashboard.html'"
            >

                Explore Ecosystem

            </button>

        </section>

        <!-- SPACER -->
        <div style="height:120px;"></div>

    </main>

    <!-- =====================================
         APP.JS
    ====================================== -->

    <script>

        // =================================
        // LOGIN
        // =================================

        const authForm =
            document.getElementById("authForm");

        authForm.addEventListener(

            "submit",

            e => {

                e.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                if(

                    email.length > 3
                    &&
                    password.length > 3

                ){

                    localStorage.setItem(
                        "corax_user",
                        email
                    );

                    createToast(
                        "Login successful 🚀"
                    );

                    setTimeout(() => {

                        window.location.href =
                            "dashboard.html";

                    },1200);

                }

            }

        );

        // =================================
        // CREATE ACCOUNT
        // =================================

        const createBtn =
            document.getElementById("createBtn");

        createBtn.addEventListener(

            "click",

            () => {

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                if(

                    email.length > 3
                    &&
                    password.length > 3

                ){

                    localStorage.setItem(
                        "corax_user",
                        email
                    );

                    createToast(
                        "Account created 💎"
                    );

                    setTimeout(() => {

                        window.location.href =
                            "dashboard.html";

                    },1200);

                } else {

                    createToast(
                        "Fill all fields"
                    );

                }

            }

        );

        // =================================
        // TOAST
        // =================================

        function createToast(message){

            const toast =
                document.createElement("div");

            toast.className =
                "corax-toast show";

            toast.innerText =
                message;

            document.body.appendChild(toast);

            setTimeout(() => {

                toast.remove();

            },3000);

        }

    </script>

    <!-- =====================================
         SCRIPTS
    ====================================== -->

    <script src="fx.js"></script>

    <script src="register-sw.js"></script>

</body>
</html>
