<!-- =========================================
     CORΛX RECEIVE.HTML
     Receive Crypto Interface
========================================= -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Receive | CORΛX</title>

    <!-- FONT -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <link rel="stylesheet" href="pwa.css" />

</head>

<body>

    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="grid-overlay"></div>

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>

    <div id="particles"></div>

    <!-- =====================================
         APP
    ====================================== -->

    <main class="app">

        <!-- =================================
             HERO
        ================================== -->

        <section class="hero">

            <div class="logo-wrapper">

                <div class="crow-container">

                    <div class="crow-wing left"></div>

                    <div class="crow-body"></div>

                    <div class="crow-wing right"></div>

                </div>

                <h1 class="logo-text">

                    RECEIVE

                </h1>

            </div>

            <p class="tagline">

                Accept Borderless Payments

            </p>

        </section>

        <!-- =================================
             RECEIVE CARD
        ================================== -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <h2 class="title">

                Wallet Address

            </h2>

            <p class="subtitle">

                Share your address securely

            </p>

            <!-- QR -->
            <div
                style="
                    margin-top:28px;
                    display:flex;
                    justify-content:center;
                "
            >

                <div
                    style="
                        width:220px;
                        height:220px;
                        border-radius:28px;
                        background:
                        linear-gradient(
                            135deg,
                            rgba(168,85,247,.25),
                            rgba(124,58,237,.12)
                        );
                        border:
                        1px solid rgba(255,255,255,.08);
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        backdrop-filter:blur(20px);
                        position:relative;
                        overflow:hidden;
                    "
                >

                    <!-- QR MOCK -->
                    <div
                        style="
                            width:150px;
                            height:150px;
                            display:grid;
                            grid-template-columns:
                            repeat(8,1fr);
                            gap:4px;
                        "
                    >

                        <script>

                            for(let i=0;i<64;i++){

                                document.write(`

                                    <div
                                        style="
                                            background:
                                            ${
                                                Math.random() > .45
                                                ?
                                                '#A855F7'
                                                :
                                                'rgba(255,255,255,.08)'
                                            };
                                            border-radius:3px;
                                        "
                                    ></div>

                                `);

                            }

                        </script>

                    </div>

                </div>

            </div>

            <!-- ADDRESS -->
            <div
                style="
                    margin-top:28px;
                "
            >

                <label
                    style="
                        color:rgba(255,255,255,.6);
                        font-size:13px;
                    "
                >

                    Your Wallet

                </label>

                <div
                    style="
                        margin-top:10px;
                        background:rgba(255,255,255,.04);
                        border:1px solid rgba(255,255,255,.08);
                        border-radius:20px;
                        padding:18px;
                        color:#fff;
                        word-break:break-all;
                        line-height:1.7;
                        font-size:14px;
                    "
                    id="walletAddress"
                >

                    0x8f42a6e2c19b84d94f28c12a71bc93a5f442d1ab

                </div>

            </div>

            <!-- BUTTON -->
            <button
                class="primary-btn"
                style="
                    margin-top:22px;
                "
                onclick="
                    copyWallet()
                "
            >

                Copy Address

            </button>

        </section>

        <!-- =================================
             NETWORKS
        ================================== -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <h2 class="title">

                Supported Networks

            </h2>

            <p class="subtitle">

                Multi-chain compatibility

            </p>

            <!-- ITEM -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Ethereum

                    </div>

                    <div class="tx-date">

                        ERC-20

                    </div>

                </div>

                <div class="positive">

                    ACTIVE

                </div>

            </div>

            <!-- ITEM -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Solana

                    </div>

                    <div class="tx-date">

                        SPL

                    </div>

                </div>

                <div class="positive">

                    ACTIVE

                </div>

            </div>

            <!-- ITEM -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Polygon

                    </div>

                    <div class="tx-date">

                        Layer 2

                    </div>

                </div>

                <div class="positive">

                    ACTIVE

                </div>

            </div>

        </section>

        <!-- =================================
             ACTIONS
        ================================== -->

        <section
            style="
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:14px;
                margin-top:18px;
            "
        >

            <button
                class="secondary-btn"
                onclick="
                    shareWallet()
                "
            >

                Share

            </button>

            <button
                class="secondary-btn"
                onclick="
                    window.location.href='dashboard.html'
                "
            >

                Dashboard

            </button>

        </section>

        <!-- SPACER -->
        <div style="height:120px;"></div>

    </main>

    <!-- =====================================
         SCRIPT
    ====================================== -->

    <script>

        function copyWallet(){

            const text =
                document.getElementById(
                    "walletAddress"
                ).innerText;

            navigator.clipboard.writeText(
                text
            );

            createToast(
                "Wallet copied 💎"
            );

        }

        function shareWallet(){

            createToast(
                "Wallet shared 🚀"
            );

        }

        function createToast(message){

            const toast =
                document.createElement("div");

            toast.className =
                "corax-toast show";

            toast.innerText =
                message;

            document.body.appendChild(
                toast
            );

            setTimeout(() => {

                toast.remove();

            },3000);

        }

    </script>

    <!-- JS -->
    <script src="wallet.js"></script>

    <script src="fx.js"></script>

    <script src="register-sw.js"></script>

</body>
</html>
