<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>404 | CORΛX</title>

    <!-- FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"

    <!-- CSS -->

    <link rel="stylesheet" href="style.css" />

<body>

    <!-- BACKGROUND -->

    <div class="grid-overlay"></div>

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>

    <div id="particles"></div>

    <!-- ERROR PAGE -->

    <main
        style="
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
        "
    >

        <section
            class="glass-card"
            style="
                max-width:640px;
                width:100%;
                text-align:center;
            "
        >

            <div class="card-glow"></div>

            <!-- LOGO -->

            <div class="hero">

                <div class="logo-wrapper">

                    <div class="crow-container">

                        <div class="crow-wing left"></div>

                        <div class="crow-body"></div>

                        <div class="crow-wing right"></div>

                    </div>

                    <h1 class="logo-text">

                        404

                    </h1>

                </div>

            </div>

            <!-- MESSAGE -->

            <h2
                style="
                    margin-top:18px;
                    font-size:42px;
                    font-weight:900;

            >

                Page Not Found

            </h2>

            <p
                style="
                    margin-top:16px;
                    color:rgba(255,255,255,.65);
                    line-height:1.7;
                    font-size:16px;

                The destination you are trying to access

            </p>

            <!-- STATUS -->

            <div
                style="
                    margin-top:28px;
                    padding:18px;
                    border-radius:22px;
                    background:
                    rgba(255,255,255,.04);
                    border:
                    1px solid rgba(255,255,255,.08);
                "
            >

                <div
                    style="
                        color:rgba(255,255,255,.55);
                        font-size:13px;
                    "
                >

                    ERROR STATUS

                </div>

                <div
                    style="
                        margin-top:10px;
                        font-size:26px;
                        font-weight:800;
                    "
                >

                    Route Not Located

                </div>

            </div>
