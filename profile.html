<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Profile | CORΛX</title>

    <!-- FONT -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <link rel="stylesheet" href="pwa.css" />

</head>

<body>

    <!-- BACKGROUND -->

    <div class="grid-overlay"></div>

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>

    <div id="particles"></div>

    <!-- APP -->

    <main class="app">

        <!-- HERO -->

        <section class="hero">

            <div class="logo-wrapper">

                <div class="crow-container">

                    <div class="crow-wing left"></div>

                    <div class="crow-body"></div>

                    <div class="crow-wing right"></div>

                </div>

                <h1 class="logo-text">

                    PROFILE

                </h1>

            </div>

            <p class="tagline">

                Your Digital Financial Identity

            </p>

        </section>

        <!-- PROFILE CARD -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <div
                style="
                    display:flex;
                    flex-direction:column;
                    align-items:center;
                    text-align:center;
                "
            >

                <!-- AVATAR -->
                <div
                    style="
                        width:120px;
                        height:120px;
                        border-radius:50%;
                        background:
                        linear-gradient(
                            135deg,
                            #A855F7,
                            #7C3AED
                        );
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:48px;
                        font-weight:900;
                        box-shadow:
                        0 0 40px rgba(168,85,247,.45);
                    "
                >

                    M

                </div>

                <!-- NAME -->
                <h2
                    style="
                        margin-top:22px;
                        font-size:28px;
                        font-weight:800;
                    "
                >

                    Marcelo Caetano

                </h2>

                <!-- STATUS -->
                <div
                    style="
                        margin-top:12px;
                        display:flex;
                        align-items:center;
                        gap:8px;
                        color:#22C55E;
                        font-weight:700;
                    "
                >

                    <div
                        style="
                            width:10px;
                            height:10px;
                            border-radius:50%;
                            background:#22C55E;
                            box-shadow:
                            0 0 12px #22C55E;
                        "
                    ></div>

                    Verified Wallet

                </div>

                <!-- WALLET -->
                <div
                    style="
                        margin-top:18px;
                        color:rgba(255,255,255,.6);
                        font-size:14px;
                    "
                >

                    0x82F4...9A3D

                </div>

            </div>

        </section>

        <!-- ACCOUNT STATS -->

        <section
            style="
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:14px;
                margin-top:18px;
            "
        >

            <!-- CARD -->
            <div class="glass-card">

                <div class="card-glow"></div>

                <div
                    style="
                        color:rgba(255,255,255,.55);
                        font-size:13px;
                    "
                >

                    Portfolio Value

                </div>

                <div
                    style="
                        margin-top:12px;
                        font-size:32px;
                        font-weight:900;
                    "
                >

                    $84.2K

                </div>

            </div>

            <!-- CARD -->
            <div class="glass-card">

                <div class="card-glow"></div>

                <div
                    style="
                        color:rgba(255,255,255,.55);
                        font-size:13px;
                    "
                >

                    NFTs Owned

                </div>

                <div
                    style="
                        margin-top:12px;
                        font-size:32px;
                        font-weight:900;
                    "
                >

                    48

                </div>

            </div>

        </section>

        <!-- PROFILE DETAILS -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <h2 class="title">

                Account Details

            </h2>

            <p class="subtitle">

                Your CORΛX ecosystem profile

            </p>

            <!-- ITEM -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Membership Tier

                    </div>

                </div>

                <div class="positive">

                    PREMIUM

                </div>

            </div>

            <!-- ITEM -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Joined Ecosystem

                    </div>

                </div>

                <div class="positive">

                    2026

                </div>

            </div>

            <!-- ITEM -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        KYC Status

                    </div>

                </div>

                <div class="positive">

                    VERIFIED

                </div>

            </div>

            <!-- ITEM -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Security Level

                    </div>

                </div>

                <div class="positive">

                    MAXIMUM

                </div>

            </div>

        </section>

        <!-- ACTIONS -->

        <section
            style="
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:14px;
                margin-top:18px;
            "
        >

            <button
                class="primary-btn"
                onclick="
                    editProfile()
                "
            >

                Edit Profile

            </button>

            <button
                class="secondary-btn"
                onclick="
                    window.location.href='dashboard.html'
                "
            >

                Dashboard

            </button>

        </section>

        <!-- SPACER -->

        <div style="height:120px;"></div>

    </main>

    <!-- SCRIPT -->

    <script>

        function editProfile(){

            createToast(
                "Profile editor opening 👤"
            );

        }

        function createToast(message){

            const toast =
                document.createElement(
                    "div"
                );

            toast.className =
                "corax-toast show";

            toast.innerText =
                message;

            document.body.appendChild(
                toast
            );

            setTimeout(() => {

                toast.remove();

            },3000);

        }

    </script>

    <!-- JS -->

    <script src="wallet.js"></script>

    <script src="fx.js"></script>

    <script src="register-sw.js"></script>

</body>
</html>
