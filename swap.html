<!-- =========================================
     CORΛX SWAP.HTML
     Multi-Chain Swap Interface
========================================= -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Swap | CORΛX</title>

    <!-- FONT -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <link rel="stylesheet" href="pwa.css" />

</head>

<body>

    <!-- BACKGROUND -->

    <div class="grid-overlay"></div>

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>

    <div id="particles"></div>

    <!-- APP -->

    <main class="app">

        <!-- HERO -->

        <section class="hero">

            <div class="logo-wrapper">

                <div class="crow-container">

                    <div class="crow-wing left"></div>

                    <div class="crow-body"></div>

                    <div class="crow-wing right"></div>

                </div>

                <h1 class="logo-text">

                    SWAP

                </h1>

            </div>

            <p class="tagline">

                Borderless Multi-Chain Liquidity

            </p>

        </section>

        <!-- SWAP CARD -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                "
            >

                <div>

                    <h2 class="title">

                        Instant Swap

                    </h2>

                    <p class="subtitle">

                        Exchange assets across chains

                    </p>

                </div>

                <div class="live-badge">

                    <div class="live-dot"></div>

                    LIVE

                </div>

            </div>

            <!-- FROM -->

            <div
                style="
                    margin-top:24px;
                    padding:20px;
                    border-radius:24px;
                    background:
                    rgba(255,255,255,.04);
                    border:
                    1px solid rgba(255,255,255,.08);
                "
            >

                <div
                    style="
                        color:rgba(255,255,255,.55);
                        font-size:13px;
                    "
                >

                    You Pay

                </div>

                <div
                    style="
                        margin-top:14px;
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                    "
                >

                    <input
                        type="number"
                        placeholder="0.00"
                        style="
                            background:none;
                            border:none;
                            outline:none;
                            color:#fff;
                            font-size:34px;
                            width:100%;
                            font-weight:800;
                        "
                    />

                    <button
                        style="
                            padding:12px 18px;
                            border:none;
                            border-radius:16px;
                            background:
                            linear-gradient(
                                135deg,
                                #A855F7,
                                #7C3AED
                            );
                            color:#fff;
                            font-weight:700;
                            cursor:pointer;
                        "
                    >

                        ETH

                    </button>

                </div>

            </div>

            <!-- SWITCH -->

            <div
                style="
                    display:flex;
                    justify-content:center;
                    margin:18px 0;
                "
            >

                <button
                    onclick="
                        reverseSwap()
                    "
                    style="
                        width:54px;
                        height:54px;
                        border-radius:50%;
                        border:none;
                        background:
                        linear-gradient(
                            135deg,
                            #A855F7,
                            #7C3AED
                        );
                        color:#fff;
                        font-size:22px;
                        cursor:pointer;
                        box-shadow:
                        0 0 24px rgba(168,85,247,.35);
                    "
                >

                    ⇅

                </button>

            </div>

            <!-- TO -->

            <div
                style="
                    padding:20px;
                    border-radius:24px;
                    background:
                    rgba(255,255,255,.04);
                    border:
                    1px solid rgba(255,255,255,.08);
                "
            >

                <div
                    style="
                        color:rgba(255,255,255,.55);
                        font-size:13px;
                    "
                >

                    You Receive

                </div>

                <div
                    style="
                        margin-top:14px;
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                    "
                >

                    <input
                        type="number"
                        placeholder="0.00"
                        style="
                            background:none;
                            border:none;
                            outline:none;
                            color:#fff;
                            font-size:34px;
                            width:100%;
                            font-weight:800;
                        "
                    />

                    <button
                        style="
                            padding:12px 18px;
                            border:none;
                            border-radius:16px;
                            background:
                            rgba(255,255,255,.08);
                            color:#fff;
                            font-weight:700;
                            cursor:pointer;
                        "
                    >

                        USDC

                    </button>

                </div>

            </div>

            <!-- DETAILS -->

            <div
                style="
                    margin-top:24px;
                "
            >

                <div class="history-item">

                    <div>

                        <div class="tx-type">

                            Exchange Rate

                        </div>

                    </div>

                    <div class="positive">

                        1 ETH = 3,420 USDC

                    </div>

                </div>

                <div class="history-item">

                    <div>

                        <div class="tx-type">

                            Network Fee

                        </div>

                    </div>

                    <div class="positive">

                        $2.14

                    </div>

                </div>

                <div class="history-item">

                    <div>

                        <div class="tx-type">

                            Estimated Time

                        </div>

                    </div>

                    <div class="positive">

                        ~12 sec

                    </div>

                </div>

            </div>

            <!-- BUTTON -->

            <button
                class="primary-btn"
                style="
                    margin-top:26px;
                "
                onclick="
                    executeSwap()
                "
            >

                Execute Swap

            </button>

        </section>

        <!-- MARKET -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <h2 class="title">

                Top Markets

            </h2>

            <p class="subtitle">

                Most active liquidity pairs

            </p>

            <div class="history-item">

                <div>

                    <div class="tx-type">

                        ETH / USDC

                    </div>

                </div>

                <div class="positive">

                    +4.8%

                </div>

            </div>

            <div class="history-item">

                <div>

                    <div class="tx-type">

                        BTC / USDT

                    </div>

                </div>

                <div class="positive">

                    +2.2%

                </div>

            </div>

            <div class="history-item">

                <div>

                    <div class="tx-type">

                        SOL / USDC

                    </div>

                </div>

                <div class="positive">

                    +8.1%

                </div>

            </div>

        </section>

        <!-- ACTIONS -->

        <section
            style="
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:14px;
                margin-top:18px;
            "
        >

            <button
                class="primary-btn"
                onclick="
                    openAdvanced()
                "
            >

                Advanced Mode

            </button>

            <button
                class="secondary-btn"
                onclick="
                    window.location.href='dashboard.html'
                "
            >

                Dashboard

            </button>

        </section>

        <!-- SPACER -->

        <div style="height:120px;"></div>

    </main>

    <!-- SCRIPT -->

    <script>

        function reverseSwap(){

            createToast(
                "Assets reversed ⇅"
            );

        }

        function executeSwap(){

            createToast(
                "Swap executed successfully 🚀"
            );

        }

        function openAdvanced(){

            createToast(
                "Advanced trading mode opening 📈"
            );

        }

        function createToast(message){

            const toast =
                document.createElement(
                    "div"
                );

            toast.className =
                "corax-toast show";

            toast.innerText =
                message;

            document.body.appendChild(
                toast
            );

            setTimeout(() => {

                toast.remove();

            },3000);

        }

    </script>

    <!-- JS -->

    <script src="wallet.js"></script>

    <script src="fx.js"></script>

    <script src="register-sw.js"></script>

</body>
</html>
