<!-- =========================================
     CORΛX SWAP.HTML
     Multi-Chain Swap Interface
========================================= -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Swap | CORΛX</title>

    <!-- FONT -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <link rel="stylesheet" href="pwa.css" />

</head>

<body>

    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="grid-overlay"></div>

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>

    <div id="particles"></div>

    <!-- =====================================
         APP
    ====================================== -->

    <main class="app">

        <!-- =================================
             HERO
        ================================== -->

        <section class="hero">

            <div class="logo-wrapper">

                <div class="crow-container">

                    <div class="crow-wing left"></div>

                    <div class="crow-body"></div>

                    <div class="crow-wing right"></div>

                </div>

                <h1 class="logo-text">

                    SW<span>Λ</span>P

                </h1>

            </div>

            <p class="tagline">

                Multi-Chain Liquidity

            </p>

        </section>

        <!-- =================================
             SWAP CARD
        ================================== -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <h2 class="title">

                Swap Assets

            </h2>

            <p class="subtitle">

                Fast decentralized exchange

            </p>

            <!-- FROM -->
            <div
                style="
                    margin-top:24px;
                "
            >

                <label
                    style="
                        color:rgba(255,255,255,.6);
                        font-size:13px;
                    "
                >

                    From

                </label>

                <div
                    style="
                        margin-top:10px;
                        background:rgba(255,255,255,.04);
                        border:1px solid rgba(255,255,255,.08);
                        border-radius:22px;
                        padding:18px;
                    "
                >

                    <div
                        style="
                            display:flex;
                            justify-content:space-between;
                            align-items:center;
                        "
                    >

                        <input
                            id="fromAmount"
                            type="number"
                            placeholder="0.00"
                            style="
                                background:none;
                                border:none;
                                color:#fff;
                                font-size:24px;
                                width:100%;
                                outline:none;
                            "
                        />

                        <select
                            id="fromToken"
                            style="
                                background:#111;
                                border:none;
                                color:#fff;
                                padding:12px;
                                border-radius:14px;
                                outline:none;
                            "
                        >

                            <option>CRX</option>

                            <option>ETH</option>

                            <option>BTC</option>

                            <option>USDT</option>

                        </select>

                    </div>

                </div>

            </div>

            <!-- ARROW -->
            <div
                style="
                    display:flex;
                    justify-content:center;
                    margin:18px 0;
                "
            >

                <button
                    onclick="reverseSwap()"
                    style="
                        width:54px;
                        height:54px;
                        border-radius:50%;
                        border:none;
                        background:linear-gradient(135deg,#A855F7,#7C3AED);
                        color:#fff;
                        font-size:22px;
                        cursor:pointer;
                    "
                >

                    ⇅

                </button>

            </div>

            <!-- TO -->
            <div>

                <label
                    style="
                        color:rgba(255,255,255,.6);
                        font-size:13px;
                    "
                >

                    To

                </label>

                <div
                    style="
                        margin-top:10px;
                        background:rgba(255,255,255,.04);
                        border:1px solid rgba(255,255,255,.08);
                        border-radius:22px;
                        padding:18px;
                    "
                >

                    <div
                        style="
                            display:flex;
                            justify-content:space-between;
                            align-items:center;
                        "
                    >

                        <input
                            id="toAmount"
                            type="number"
                            placeholder="0.00"
                            style="
                                background:none;
                                border:none;
                                color:#fff;
                                font-size:24px;
                                width:100%;
                                outline:none;
                            "
                        />

                        <select
                            id="toToken"
                            style="
                                background:#111;
                                border:none;
                                color:#fff;
                                padding:12px;
                                border-radius:14px;
                                outline:none;
                            "
                        >

                            <option>USDT</option>

                            <option>CRX</option>

                            <option>ETH</option>

                            <option>BTC</option>

                        </select>

                    </div>

                </div>

            </div>

            <!-- RATE -->
            <div
                style="
                    margin-top:22px;
                    display:flex;
                    justify-content:space-between;
                    color:rgba(255,255,255,.5);
                    font-size:14px;
                "
            >

                <span>

                    Exchange Rate

                </span>

                <span>

                    1 CRX = 2.48 USDT

                </span>

            </div>

            <!-- BUTTON -->
            <button
                class="primary-btn"
                style="
                    margin-top:26px;
                "
                onclick="
                    executeSwap()
                "
            >

                Swap Now

            </button>

        </section>

        <!-- =================================
             LIQUIDITY
        ================================== -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <h2 class="title">

                Liquidity Pools

            </h2>

            <p class="subtitle">

                Available market liquidity

            </p>

            <!-- ITEM -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        CRX / USDT

                    </div>

                    <div class="tx-date">

                        Main pool

                    </div>

                </div>

                <div class="positive">

                    $18.4M

                </div>

            </div>

            <!-- ITEM -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        CRX / ETH

                    </div>

                    <div class="tx-date">

                        Ethereum liquidity

                    </div>

                </div>

                <div class="positive">

                    $8.1M

                </div>

            </div>

            <!-- ITEM -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        CRX / BTC

                    </div>

                    <div class="tx-date">

                        Bitcoin bridge

                    </div>

                </div>

                <div class="positive">

                    $5.2M

                </div>

            </div>

        </section>

        <!-- =================================
             ACTIONS
        ================================== -->

        <section
            style="
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:14px;
                margin-top:18px;
            "
        >

            <button
                class="secondary-btn"
                onclick="
                    window.location.href='market.html'
                "
            >

                Market

            </button>

            <button
                class="secondary-btn"
                onclick="
                    window.location.href='dashboard.html'
                "
            >

                Dashboard

            </button>

        </section>

        <!-- SPACER -->
        <div style="height:120px;"></div>

    </main>

    <!-- =====================================
         SCRIPT
    ====================================== -->

    <script>

        function reverseSwap(){

            const fromToken =
                document.getElementById(
                    "fromToken"
                );

            const toToken =
                document.getElementById(
                    "toToken"
                );

            const temp =
                fromToken.value;

            fromToken.value =
                toToken.value;

            toToken.value =
                temp;

            createToast(
                "Swap direction changed 🔄"
            );

        }

        function executeSwap(){

            const from =
                document.getElementById(
                    "fromAmount"
                ).value;

            if(!from){

                createToast(
                    "Enter amount"
                );

                return;

            }

            createToast(
                "Swap executed ⚡"
            );

        }

        function createToast(message){

            const toast =
                document.createElement("div");

            toast.className =
                "corax-toast show";

            toast.innerText =
                message;

            document.body.appendChild(
                toast
            );

            setTimeout(() => {

                toast.remove();

            },3000);

        }

    </script>

    <!-- JS -->
    <script src="wallet.js"></script>

    <script src="fx.js"></script>

    <script src="register-sw.js"></script>

</body>
</html>
