<!-- =========================================
     CORΛX BRIDGE.HTML
     Cross-Chain Bridge Interface
========================================= -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Bridge | CORΛX</title>

    <!-- FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    />

    <!-- CSS -->

    <link rel="stylesheet" href="style.css" />

    <link rel="stylesheet" href="pwa.css" />

</head>

<body>

    <!-- BACKGROUND -->

    <div class="grid-overlay"></div>

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>

    <div id="particles"></div>

    <!-- APP -->

    <main class="app">

        <!-- HERO -->

        <section class="hero">

            <div class="logo-wrapper">

                <div class="crow-container">

                    <div class="crow-wing left"></div>

                    <div class="crow-body"></div>

                    <div class="crow-wing right"></div>

                </div>

                <h1 class="logo-text">

                    BRIDGE

                </h1>

            </div>

            <p class="tagline">

                Seamless Cross-Chain Infrastructure

            </p>

        </section>

        <!-- BRIDGE CARD -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <div
                style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                "
            >

                <div>

                    <h2 class="title">

                        Transfer Assets

                    </h2>

                    <p class="subtitle">

                        Move liquidity between blockchains

                    </p>

                </div>

                <div class="live-badge">

                    <div class="live-dot"></div>

                    ONLINE

                </div>

            </div>

            <!-- FROM NETWORK -->

            <div
                style="
                    margin-top:26px;
                "
            >

                <label class="input-label">

                    From Network

                </label>

                <select class="corax-input">

                    <option>Ethereum</option>

                    <option>Polygon</option>

                    <option>Base</option>

                    <option>Solana</option>

                    <option>BNB Chain</option>

                </select>

            </div>

            <!-- SWITCH -->

            <div
                style="
                    display:flex;
                    justify-content:center;
                    margin:18px 0;
                "
            >

                <button
                    onclick="
                        reverseBridge()
                    "
                    style="
                        width:56px;
                        height:56px;
                        border-radius:50%;
                        border:none;
                        background:
                        linear-gradient(
                            135deg,
                            #A855F7,
                            #7C3AED
                        );
                        color:#fff;
                        font-size:24px;
                        cursor:pointer;
                        box-shadow:
                        0 0 24px rgba(168,85,247,.35);
                    "
                >

                    ⇅

                </button>

            </div>

            <!-- TO NETWORK -->

            <div>

                <label class="input-label">

                    To Network

                </label>

                <select class="corax-input">

                    <option>Polygon</option>

                    <option>Ethereum</option>

                    <option>Base</option>

                    <option>Solana</option>

                    <option>BNB Chain</option>

                </select>

            </div>

            <!-- AMOUNT -->

            <div
                style="
                    margin-top:24px;
                "
            >

                <label class="input-label">

                    Transfer Amount

                </label>

                <input
                    type="number"
                    placeholder="0.00"
                    class="corax-input"
                />

            </div>

            <!-- TOKEN -->

            <div
                style="
                    margin-top:24px;
                "
            >

                <label class="input-label">

                    Asset

                </label>

                <select class="corax-input">

                    <option>USDC</option>

                    <option>ETH</option>

                    <option>BTC</option>

                    <option>CRX</option>

                    <option>SOL</option>

                </select>

            </div>

            <!-- DETAILS -->

            <div
                style="
                    margin-top:28px;
                "
            >

                <div class="history-item">

                    <div>

                        <div class="tx-type">

                            Estimated Fee

                        </div>

                    </div>

                    <div class="positive">

                        $3.12

                    </div>

                </div>

                <div class="history-item">

                    <div>

                        <div class="tx-type">

                            Estimated Time

                        </div>

                    </div>

                    <div class="positive">

                        ~45 sec

                    </div>

                </div>

                <div class="history-item">

                    <div>

                        <div class="tx-type">

                            Security Layer

                        </div>

                    </div>

                    <div class="positive">

                        VERIFIED

                    </div>

                </div>

            </div>

            <!-- BUTTON -->

            <button
                class="primary-btn"
                style="
                    margin-top:28px;
                "
                onclick="
                    executeBridge()
                "
            >

                Bridge Assets

            </button>

        </section>

        <!-- NETWORK STATUS -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <h2 class="title">

                Supported Networks

            </h2>

            <p class="subtitle">

                Active bridge infrastructure

            </p>

            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Ethereum

                    </div>

                </div>

                <div class="positive">

                    ACTIVE

                </div>

            </div>

            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Polygon

                    </div>

                </div>

                <div class="positive">

                    ACTIVE

                </div>

            </div>

            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Solana

                    </div>

                </div>

                <div class="positive">

                    ACTIVE

                </div>

            </div>

            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Base

                    </div>

                </div>

                <div class="positive">

                    ACTIVE

                </div>

            </div>

        </section>

        <!-- ACTIONS -->

        <section
            style="
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:14px;
                margin-top:18px;
            "
        >

            <button
                class="primary-btn"
                onclick="
                    viewExplorer()
                "
            >

                Explorer

            </button>

            <button
                class="secondary-btn"
                onclick="
                    window.location.href='dashboard.html'
                "
            >

                Dashboard

            </button>

        </section>

        <!-- SPACER -->

        <div style="height:120px;"></div>

    </main>

    <!-- STYLE -->

    <style>

        .input-label{

            display:block;

            margin-bottom:10px;

            color:rgba(255,255,255,.65);

            font-size:13px;

        }

        .corax-input{

            width:100%;

            padding:20px;

            border-radius:22px;

            border:
            1px solid rgba(255,255,255,.08);

            background:
            rgba(255,255,255,.04);

            color:#fff;

            outline:none;

            font-size:16px;

        }

    </style>

    <!-- SCRIPT -->

    <script>

        function reverseBridge(){

            createToast(
                "Networks reversed 🔄"
            );

        }

        function executeBridge(){

            createToast(
                "Bridge transfer initiated 🌉"
            );

        }

        function viewExplorer(){

            createToast(
                "Opening blockchain explorer 🔍"
            );

        }

        function createToast(message){

            const toast =
                document.createElement(
                    "div"
                );

            toast.className =
                "corax-toast show";

            toast.innerText =
                message;

            document.body.appendChild(
                toast
            );

            setTimeout(() => {

                toast.remove();

            },3000);

        }

    </script>

    <!-- JS -->

    <script src="wallet.js"></script>

    <script src="fx.js"></script>

    <script src="register-sw.js"></script>

</body>
</html>
