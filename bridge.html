<!-- =========================================
     CORΛX BRIDGE.HTML
     Multi-Chain Bridge
========================================= -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Bridge | CORΛX</title>

    <!-- FONT -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <link rel="stylesheet" href="pwa.css" />

</head>

<body>

    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="grid-overlay"></div>

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>

    <div id="particles"></div>

    <!-- =====================================
         APP
    ====================================== -->

    <main class="app">

        <!-- =================================
             HERO
        ================================== -->

        <section class="hero">

            <div class="logo-wrapper">

                <div class="crow-container">

                    <div class="crow-wing left"></div>

                    <div class="crow-body"></div>

                    <div class="crow-wing right"></div>

                </div>

                <h1 class="logo-text">

                    BRIDGE

                </h1>

            </div>

            <p class="tagline">

                Move Assets Across Chains

            </p>

        </section>

        <!-- =================================
             BRIDGE CARD
        ================================== -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <h2 class="title">

                Cross-Chain Transfer

            </h2>

            <p class="subtitle">

                Secure decentralized bridging

            </p>

            <!-- FROM NETWORK -->
            <div
                style="
                    margin-top:24px;
                "
            >

                <label
                    style="
                        color:rgba(255,255,255,.6);
                        font-size:13px;
                    "
                >

                    From Network

                </label>

                <select
                    id="fromChain"
                    style="
                        margin-top:10px;
                        width:100%;
                        padding:18px;
                        border-radius:20px;
                        border:1px solid rgba(255,255,255,.08);
                        background:rgba(255,255,255,.04);
                        color:#fff;
                        outline:none;
                    "
                >

                    <option>Ethereum</option>

                    <option>Polygon</option>

                    <option>Base</option>

                    <option>BNB Chain</option>

                    <option>Solana</option>

                </select>

            </div>

            <!-- SWITCH -->
            <div
                style="
                    display:flex;
                    justify-content:center;
                    margin:20px 0;
                "
            >

                <button
                    onclick="reverseBridge()"
                    style="
                        width:54px;
                        height:54px;
                        border-radius:50%;
                        border:none;
                        background:
                        linear-gradient(
                            135deg,
                            #A855F7,
                            #7C3AED
                        );
                        color:#fff;
                        font-size:22px;
                        cursor:pointer;
                    "
                >

                    ⇅

                </button>

            </div>

            <!-- TO NETWORK -->
            <div>

                <label
                    style="
                        color:rgba(255,255,255,.6);
                        font-size:13px;
                    "
                >

                    To Network

                </label>

                <select
                    id="toChain"
                    style="
                        margin-top:10px;
                        width:100%;
                        padding:18px;
                        border-radius:20px;
                        border:1px solid rgba(255,255,255,.08);
                        background:rgba(255,255,255,.04);
                        color:#fff;
                        outline:none;
                    "
                >

                    <option>Solana</option>

                    <option>Ethereum</option>

                    <option>Polygon</option>

                    <option>Base</option>

                    <option>BNB Chain</option>

                </select>

            </div>

            <!-- AMOUNT -->
            <div
                style="
                    margin-top:22px;
                "
            >

                <label
                    style="
                        color:rgba(255,255,255,.6);
                        font-size:13px;
                    "
                >

                    Amount

                </label>

                <input
                    id="bridgeAmount"
                    type="number"
                    placeholder="0.00"
                    style="
                        margin-top:10px;
                        width:100%;
                        padding:18px;
                        border-radius:20px;
                        border:1px solid rgba(255,255,255,.08);
                        background:rgba(255,255,255,.04);
                        color:#fff;
                        outline:none;
                        font-size:20px;
                    "
                />

            </div>

            <!-- INFO -->
            <div
                style="
                    margin-top:22px;
                    display:grid;
                    gap:12px;
                "
            >

                <div
                    style="
                        display:flex;
                        justify-content:space-between;
                        color:rgba(255,255,255,.6);
                        font-size:14px;
                    "
                >

                    <span>

                        Estimated Time

                    </span>

                    <span>

                        ~2 Minutes

                    </span>

                </div>

                <div
                    style="
                        display:flex;
                        justify-content:space-between;
                        color:rgba(255,255,255,.6);
                        font-size:14px;
                    "
                >

                    <span>

                        Bridge Fee

                    </span>

                    <span>

                        0.12%

                    </span>

                </div>

            </div>

            <!-- BUTTON -->
            <button
                class="primary-btn"
                style="
                    margin-top:26px;
                "
                onclick="
                    executeBridge()
                "
            >

                Bridge Assets

            </button>

        </section>

        <!-- =================================
             NETWORK STATUS
        ================================== -->

        <section class="glass-card">

            <div class="card-glow"></div>

            <h2 class="title">

                Network Status

            </h2>

            <p class="subtitle">

                Bridge availability & liquidity

            </p>

            <!-- ITEM -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Ethereum

                    </div>

                    <div class="tx-date">

                        Main liquidity hub

                    </div>

                </div>

                <div class="positive">

                    ONLINE

                </div>

            </div>

            <!-- ITEM -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Solana

                    </div>

                    <div class="tx-date">

                        Fast settlement

                    </div>

                </div>

                <div class="positive">

                    ONLINE

                </div>

            </div>

            <!-- ITEM -->
            <div class="history-item">

                <div>

                    <div class="tx-type">

                        Polygon

                    </div>

                    <div class="tx-date">

                        Low-cost transfers

                    </div>

                </div>

                <div class="positive">

                    ONLINE

                </div>

            </div>

        </section>

        <!-- =================================
             ACTIONS
        ================================== -->

        <section
            style="
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:14px;
                margin-top:18px;
            "
        >

            <button
                class="secondary-btn"
                onclick="
                    viewTransactions()
                "
            >

                Bridge History

            </button>

            <button
                class="secondary-btn"
                onclick="
                    window.location.href='dashboard.html'
                "
            >

                Dashboard

            </button>

        </section>

        <!-- SPACER -->
        <div style="height:120px;"></div>

    </main>

    <!-- =====================================
         SCRIPT
    ====================================== -->

    <script>

        function reverseBridge(){

            const from =
                document.getElementById(
                    "fromChain"
                );

            const to =
                document.getElementById(
                    "toChain"
                );

            const temp =
                from.value;

            from.value =
                to.value;

            to.value =
                temp;

            createToast(
                "Networks switched 🔄"
            );

        }

        function executeBridge(){

            const amount =
                document.getElementById(
                    "bridgeAmount"
                ).value;

            if(!amount){

                createToast(
                    "Enter amount"
                );

                return;

            }

            createToast(
                "Bridge transaction started 🌉"
            );

        }

        function viewTransactions(){

            createToast(
                "Opening bridge history 📜"
            );

        }

        function createToast(message){

            const toast =
                document.createElement("div");

            toast.className =
                "corax-toast show";

            toast.innerText =
                message;

            document.body.appendChild(
                toast
            );

            setTimeout(() => {

                toast.remove();

            },3000);

        }

    </script>

    <!-- JS -->
    <script src="wallet.js"></script>

    <script src="fx.js"></script>

    <script src="register-sw.js"></script>

</body>
</html>
